# Craft apps desktop (linuxserver/craft-apps) + the Frontier UI Craft bridge.
# LAN ONLY: the desktop has a passwordless-sudo terminal. Never expose these ports to the internet.
#   1. cp .env.example .env  and set LAN_IP, CUSTOM_USER, PASSWORD
#   2. docker compose up -d
#   3. ./install-extra-apps.sh   (adds WordCraft, GridCraft, DeckCraft, CADCraft, SoundCraft, ArtCraft Launcher + the bridge)
name: craft-apps
services:
  craft-apps:
    image: lscr.io/linuxserver/craft-apps:latest
    platform: linux/amd64        # the image is x86-64 only; Apple Silicon / ARM hosts run it under emulation (Rosetta)
    container_name: craft-apps
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env
    environment:
      - PUID=1000
      - PGID=1000
      - TITLE=Craft
    # Optional GPU acceleration: uncomment and point at a render node
    # devices: ["/dev/dri/renderD128:/dev/dri/renderD128"]
    # environment: ["DRINODE=/dev/dri/renderD128"]
    volumes:
      - ./config:/config
    configs:                     # the Craft bridge as an s6 service: starts with the container and restarts if it stops
      - source: craft-bridge-service
        target: /custom-services.d/craft-bridge
    ports:
      - "${LAN_IP}:18260:3001"   # https desktop
      - "${LAN_IP}:18261:3000"   # http desktop
    networks: [openwebui]        # the bridge listens on craft-apps:8790 for Open WebUI only (not published)
networks:
  openwebui:
    external: true
    name: ${OPENWEBUI_NETWORK:-open-webui_default}
configs:
  # Inline (Docker Compose 2.23+): copied in root-owned and executable (0755) on any host, macOS included - linuxserver
  # images only run custom services owned by root, which a bind-mounted file often isn't. "$$" is a literal "$".
  craft-bridge-service:
    content: |
      #!/usr/bin/with-contenv bash
      BRIDGE=/config/craft-bridge/bridge.py
      if [ ! -f "$$BRIDGE" ]; then
        echo "[craft-bridge] $$BRIDGE not found yet (run install-extra-apps.sh); retrying in 60 s"
        exec sleep 60
      fi
      cd /config
      exec s6-setuidgid abc env HOME=/config /lsiopy/bin/python3 "$$BRIDGE"
