server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  types { application/wasm wasm; text/javascript js; application/json json; application/x-protobuf pbf; }
  include /etc/nginx/mime.types;
  gzip_static on;
  gzip on; gzip_types application/wasm text/javascript application/javascript text/css application/json application/x-protobuf;
  add_header X-Content-Type-Options nosniff always;

  location = / { return 302 /craft/launcher/; }

  # Local basemap: planet PMTiles (range requests), fonts, sprites, JS
  location /maps/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Range, If-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    add_header Cache-Control "public, max-age=86400" always;
    if ($request_method = OPTIONS) { return 204; }
  }
  location = /maps/planet.pmtiles {
    alias /srv/planet/planet.pmtiles;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Range, If-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    add_header Cache-Control "public, max-age=86400" always;
    if ($request_method = OPTIONS) { return 204; }
  }
  location = /maps/health { default_type application/json; add_header Access-Control-Allow-Origin * always; return 200 '{"ok":true}'; }

  # Craft web apps (static wasm builds) + ArtCraft launcher catalog
  location /craft/ {
    alias /srv/craft/;
    index index.html;
    location ~* \.(wasm|js)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* index\.html$ { add_header Cache-Control "no-cache"; }
  }
}
