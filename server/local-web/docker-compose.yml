# Static server for the self-hosted basemap (planet PMTiles + fonts + JS) and the Craft web apps.
#   ./setup.sh /path/to/big/disk/maps      (downloads JS, fonts, sprites, Craft web apps, and the ~140 GB planet)
#   LAN_IP=192.168.1.10 MAPS_DIR=/path/to/big/disk/maps docker compose up -d
# Then set the Frontier UI valves: tiles_url=http://LAN_IP:18262/maps  craft_web_url=http://LAN_IP:18262/craft
name: local-web
services:
  local-web:
    image: nginx:1.29-alpine
    container_name: local-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro
      - ./craft:/srv/craft:ro
      - ${MAPS_DIR}:/srv/planet:ro
    ports:
      - "${LAN_IP}:18262:80"
